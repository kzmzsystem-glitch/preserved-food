<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>非常食備蓄</title>
<style>
  :root { --green:#06c755; --ink:#222; --sub:#777; --line:#e3e3e3; --bg:#f5f5f2; --red:#d93025; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"Hiragino Sans",sans-serif; color:var(--ink); background:var(--bg); }
  header { background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  .tabs { display:flex; }
  .tabs button { flex:1; padding:14px 0; font-size:16px; font-weight:600; border:0; background:none; color:var(--sub); border-bottom:3px solid transparent; }
  .tabs button.on { color:var(--ink); border-bottom-color:var(--green); }
  main { padding:16px; max-width:520px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .scanner { position:relative; background:#000; border-radius:12px; overflow:hidden; aspect-ratio:4/3; }
  .scanner video { width:100%; height:100%; object-fit:cover; }
  .scanner .guide { position:absolute; left:10%; right:10%; top:36%; bottom:36%; border:2px solid rgba(255,255,255,.9); border-radius:8px; box-shadow:0 0 0 999px rgba(0,0,0,.35); }
  .hint { font-size:13px; color:var(--sub); margin:8px 2px 0; }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 4px; }
  input { width:100%; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  button.primary { width:100%; margin-top:18px; padding:15px; font-size:17px; font-weight:700; color:#fff; background:var(--green); border:0; border-radius:10px; }
  button.primary:disabled { opacity:.5; }
  button.ghost { padding:12px 16px; font-size:15px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  button.link { background:none; border:0; color:var(--sub); font-size:14px; text-decoration:underline; margin-top:14px; width:100%; }
  .jan { font-size:14px; color:var(--sub); letter-spacing:.05em; }
  .name { font-size:20px; font-weight:700; margin:4px 0 2px; }
  .status { font-size:13px; margin-top:4px; }
  .status.ok { color:var(--green); } .status.warn { color:#b26a00; } .status.err { color:var(--red); }
  table { width:100%; border-collapse:collapse; margin-top:8px; font-size:15px; }
  td { padding:8px 0; border-top:1px solid var(--line); }
  td:last-child { text-align:right; }
  .msg { text-align:center; padding:28px 12px; }
  .msg .big { font-size:34px; }
  .msg p { font-size:16px; margin:8px 0; }
  .hidden { display:none !important; }
</style>
</head>
<body>
<header>
  <div class="tabs">
    <button id="tabBuy" type="button">購入</button>
    <button id="tabUse" type="button">消費</button>
  </div>
</header>
<main>
  <section id="scanView">
    <div class="scanner"><video id="video" playsinline muted></video><div class="guide"></div></div>
    <p class="hint" id="scanHint" data-v="v4">バーコード(JAN)を枠に合わせてください</p>
    <div class="card" style="margin-top:14px">
      <label style="margin-top:0">読み取れない場合は番号を入力</label>
      <div class="row">
        <input id="manualJan" inputmode="numeric" placeholder="4901234567894" maxlength="13">
        <button class="ghost" id="manualBtn" type="button">決定</button>
      </div>
    </div>
  </section>

  <section id="buyView" class="hidden">
    <div class="card">
      <div class="jan" id="buyJan"></div>
      <label>商品名</label>
      <input id="buyName" placeholder="商品名を入力">
      <div class="status" id="buyNameStatus"></div>
      <label>個数</label>
      <input id="buyQty" type="number" inputmode="numeric" min="1" max="999" value="1">
      <label>消費期限</label>
      <input id="buyExpiry" type="date">
      <button class="primary" id="buySubmit" type="button">登録</button>
      <button class="link" id="buyBack" type="button">スキャンに戻る</button>
    </div>
  </section>

  <section id="useView" class="hidden">
    <div class="card">
      <div class="jan" id="useJan"></div>
      <div class="name" id="useName"></div>
      <div class="status" id="useStatus"></div>
      <table id="useLots"></table>
      <div id="useForm">
        <label>消費する個数</label>
        <input id="useQty" type="number" inputmode="numeric" min="1" value="1">
        <button class="primary" id="useSubmit" type="button">登録</button>
      </div>
      <button class="link" id="useBack" type="button">スキャンに戻る</button>
    </div>
  </section>

  <section id="doneView" class="hidden">
    <div class="card msg">
      <div class="big" id="doneIcon">✅</div>
      <p id="doneText"></p>
      <button class="primary" id="doneNext" type="button">続けて登録</button>
      <button class="link" id="doneClose" type="button">閉じる</button>
    </div>
  </section>

  <section id="errView" class="hidden">
    <div class="card msg"><div class="big">⚠️</div><p id="errText"></p></div>
  </section>
</main>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
